                    type: boolean
                  hasIssues:
                    description: HasIssues enables the Issues feature on the repository.
                    type: boolean
                  hasProjects:
                    description: HasProjects enables the Projects feature on the repository.
                    type: boolean
                  hasWiki:
                    description: HasWiki enables the Wiki feature on the repository.
                    type: boolean
                  isTemplate:
                    description: |-
                      Set to true to make this repo available as a template repository.
                      Default: false
                    type: boolean
                  mergeCommitMessage:
                    description: |-
                      MergeCommitMessage sets the default body format for merge commits.
                      Requires AllowMergeCommit to be true; GitHub rejects the request otherwise.
                    enum:
                    - PR_BODY
                    - PR_TITLE
                    - BLANK
                    type: string
                  mergeCommitTitle:
                    description: |-
                      MergeCommitTitle sets the default title format for merge commits.
                      Requires AllowMergeCommit to be true; GitHub rejects the request otherwise.
                    enum:
                    - PR_TITLE
                    - MERGE_MESSAGE
                    type: string
                  org:
