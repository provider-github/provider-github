          spec:
            description: A RepositorySpec defines the desired state of a Repository.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: RepositoryParameters are the configurable fields of a
                  Repository.
                properties:
                  allowAutoMerge:
                    description: |-
                      AllowAutoMerge allows auto-merge on the repository.
                      Requires GitHub Pro/Team/Enterprise or a public repository; on a free-tier
                      org's private repo, GitHub silently rejects setting this to true, which
                      causes a reconcile loop.
                    type: boolean
                  allowMergeCommit:
                    description: AllowMergeCommit allows merge commits on the repository.
                    type: boolean
                  allowRebaseMerge:
                    description: AllowRebaseMerge allows rebase merging on the repository.
                    type: boolean
                  allowSquashMerge:
                    description: AllowSquashMerge allows squash merging on the repository.
                    type: boolean
                  allowUpdateBranch:
                    description: AllowUpdateBranch allows users to update pull request
                      branches from the base branch.
                    type: boolean
                  archived:
                    description: Archived sets if a repository should be archived
