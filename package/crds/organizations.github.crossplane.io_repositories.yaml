                                name:
                                  description: Name is how this rule appears to users.
                                  type: string
                                negate:
                                  description: 'Negate inverts the rule: matching
                                    the pattern fails it.'
                                  type: boolean
                                operator:
                                  description: Operator is how the pattern is matched.
                                  enum:
                                  - starts_with
                                  - ends_with
                                  - contains
                                  - regex
                                  type: string
                                pattern:
                                  description: Pattern is the pattern to match with.
                                  type: string
