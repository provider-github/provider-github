                              - operator
                              - pattern
                              type: object
                            codeCoverage:
                              description: CodeCoverage requires code coverage results
                                before merging.
                              properties:
                                maxCoverageDrop:
                                  description: |-
                                    MaxCoverageDrop is the largest drop in coverage percentage allowed, a decimal number from 0 to 100 such as "5" or "0.5".
                                    Unset leaves the drop open.
                                  pattern: ^(100(\.0+)?|[0-9]{1,2}(\.[0-9]+)?)$
                                  type: string
                                minimumCoverage:
                                  description: |-
                                    MinimumCoverage is the lowest coverage percentage allowed, a decimal number from 0 to 100 such as "80" or "72.5".
                                    Unset leaves the minimum open.
                                  pattern: ^(100(\.0+)?|[0-9]{1,2}(\.[0-9]+)?)$
                                  type: string
                              type: object
                            codeQuality:
                              description: CodeQuality requires code quality results
                                before merging.
                              properties:
                                severity:
                                  description: Severity is the lowest severity of
                                    code quality results that blocks a pull request.
                                  enum:
                                  - errors
                                  - warnings
                                  - notes
                                  - all
                                  type: string
                              required:
                              - severity
                              type: object
                            codeScanning:
                              description: CodeScanning requires code scanning results
                                before merging.
                              properties:
                                codeScanningTools:
                                  description: CodeScanningTools is the list of tools
                                    that must provide code scanning results.
                                  items:
                                    properties:
                                      alertsThreshold:
                                        description: AlertsThreshold is the severity
                                          level at which code scanning results that
                                          raise alerts block a reference update.
                                        enum:
                                        - none
                                        - errors
                                        - errors_and_warnings
                                        - all
                                        type: string
                                      securityAlertsThreshold:
                                        description: SecurityAlertsThreshold is the
                                          severity level at which code scanning results
                                          that raise security alerts block a reference
                                          update.
                                        enum:
                                        - none
                                        - critical
                                        - high_or_higher
                                        - medium_or_higher
                                        - all
                                        type: string
                                      tool:
                                        description: Tool is the name of a code scanning
                                          tool.
                                        type: string
                                    required:
                                    - alertsThreshold
                                    - securityAlertsThreshold
                                    - tool
                                    type: object
                                  type: array
                              required:
                              - codeScanningTools
                              type: object
                            commitAuthorEmailPattern:
                              description: CommitAuthorEmailPattern requires commit
                                author emails to match a pattern.
                              properties:
                                name:
                                  description: Name is how this rule appears to users.
                                  type: string
                                negate:
                                  description: 'Negate inverts the rule: matching
