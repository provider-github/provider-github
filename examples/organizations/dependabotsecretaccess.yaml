---
# Repository access for an existing Dependabot secret, limited to selected repositories.
# The secret must already exist on GitHub with visibility "selected".
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: DependabotSecretAccess
metadata:
  name: sample-dependabot-secret-selected
  annotations:
    crossplane.io/external-name: SAMPLE_DEPENDABOT_SECRET_SELECTED
spec:
  forProvider:
    orgRef:
      name: pgh-sample-organization
    visibility: selected
    selectedRepositories:
    - repoRef:
        name: pgh-sample-repository
---
# An existing Dependabot secret available to all private repositories.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: DependabotSecretAccess
metadata:
  name: sample-dependabot-secret-private
  annotations:
    crossplane.io/external-name: SAMPLE_DEPENDABOT_SECRET_PRIVATE
spec:
  forProvider:
    orgRef:
      name: pgh-sample-organization
    visibility: private
