---
apiVersion: v1
data:
  foo_com: LW5ldyBzb1NlY3JldE11Y2hXb3cxMzM3Cg==
kind: Secret
metadata:
  name: sample-repository-webhook-secrets
  namespace: production
type: Opaque
---
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: sample-repository
spec:
  writeConnectionSecretToRef:
    name: sample-repository-repo-state
    namespace: production
  forProvider:
    createFromTemplate:
      owner: octo-org
      repo: octo-template
      includeAllBranches: true
    description: This is a sample repository
    topics:
      - crossplane
      - github
      - infrastructure-as-code
    defaultBranch: main
    allowMergeCommit: true
    allowSquashMerge: true
    allowRebaseMerge: false
    allowAutoMerge: false
    allowUpdateBranch: true
    deleteBranchOnMerge: true
    hasIssues: true
    hasProjects: false
    hasWiki: false
    hasDiscussions: false
    mergeCommitTitle: PR_TITLE
    mergeCommitMessage: PR_BODY
    squashMergeCommitTitle: PR_TITLE
    squashMergeCommitMessage: PR_BODY
    orgRef:
      name: pgh-sample-organization
    permissions:
      users:
        - userRef:
            name: pgh-sample-user
          role: push
      teams:
        - teamRef:
            name: sample-team
          role: pull
    webhooks:
      - active: true
        contentType: json
        events:
          - workflow_job
        insecureSsl: false
        url: https://example.com
      - active: true
        contentType: json
        events:
          - workflow_job
        insecureSsl: false
        url: https://foo.com
        secretKeyRef:
          key: foo_com
          name: sample-repository-webhook-secrets
          namespace: production
    branchProtectionRules:
      - branch: main
        enforceAdmins: true
        requireLinearHistory: true
        requiredConversationResolution: true
        requiredPullRequestReviews:
          dismissStaleReviews: true
          requiredApprovingReviewCount: 1
          requireCodeOwnerReviews: true
          requireLastPushApproval: true
          bypassPullRequestAllowances:
            users:
              - ci-user
        requiredStatusChecks:
          strict: true
          checks:
            - context: terraform_validate
            - context: deploy
              appId: 123456
    repositoryRules:
      - name: test-ruleset-2
        target: branch
        bypassActors:
          - actorId: 12345
            actorType: Team
            bypassMode: always
          - actorType: OrganizationAdmin
            bypassMode: always
          - actorId: 67890
            actorType: Integration
            bypassMode: always
          - actorId: 2
            actorType: RepositoryRole
            bypassMode: always
        # Ref patterns are full refs (refs/heads/..., refs/tags/...), ~DEFAULT_BRANCH or ~ALL.
        conditions:
          refName:
            include: []
            exclude:
              - refs/heads/exclude
              - refs/heads/feature/exclude
        rules:
          creation: false
          nonFastForward: true
          requiredLinearHistory: true
          deletion: true
          update: true
          requiredSignatures: true
          requiredDeployments:
            environments:
              - production-github
          pullRequest:
            dismissStaleReviewsOnPush: false
            requiredApprovingReviewCount: 4
            requireCodeOwnerReview: true
            requireLastPushApproval: true
            requiredReviewThreadResolution: true
            allowedMergeMethods:
              - squash
            requiredReviewers:
              - filePatterns:
                  - "*.go"
                minimumApprovals: 1
                reviewer:
                  id: 12345
                  type: Team
          requiredStatusChecks:
            strictRequiredStatusChecksPolicy: true
            doNotEnforceOnCreate: true
            requiredStatusChecks:
              - context: validate
      - name: merge-queue
        target: branch
        conditions:
          refName:
            include:
              - ~DEFAULT_BRANCH
            exclude: []
        rules:
          mergeQueue:
            checkResponseTimeoutMinutes: 60
            groupingStrategy: ALLGREEN
            maxEntriesToBuild: 5
            maxEntriesToMerge: 5
            mergeMethod: SQUASH
            minEntriesToMerge: 1
            minEntriesToMergeWaitMinutes: 5
          commitMessagePattern:
            operator: regex
            pattern: "^(feat|fix|chore): "
---
# Push rulesets take no conditions and need a private or internal repository
# on a GitHub Team or Enterprise plan.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: sample-private-repository
spec:
  forProvider:
    description: This is a sample private repository
    orgRef:
      name: pgh-sample-organization
    private: true
    repositoryRules:
      - name: no-binaries
        target: push
        rules:
          fileExtensionRestriction:
            restrictedFileExtensions:
              - "*.exe"
              - "*.zip"
---
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: Repository
metadata:
  name: sample-fork
spec:
  forProvider:
    description: This is a sample fork
    orgRef:
      name: pgh-sample-organization
    createFork:
      owner: some-org
      repo: some-repo
      defaultBranchOnly: true
