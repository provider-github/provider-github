---
# Repository access for an existing Actions secret, limited to selected repositories.
# The secret must already exist on GitHub with visibility "selected".
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: sample-actions-secret-selected
  annotations:
    crossplane.io/external-name: SAMPLE_ACTIONS_SECRET_SELECTED
spec:
  forProvider:
    orgRef:
      name: pgh-sample-organization
    visibility: selected
    selectedRepositories:
    - repoRef:
        name: pgh-sample-repository
---
# An existing Actions secret available to all private repositories.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: ActionsSecretAccess
metadata:
  name: sample-actions-secret-private
  annotations:
    crossplane.io/external-name: SAMPLE_ACTIONS_SECRET_PRIVATE
spec:
  forProvider:
    orgRef:
      name: pgh-sample-organization
    visibility: private
