---
# Organization webhook signed with a secret read from a Kubernetes Secret.
# The applied secret is recorded in the connection secret to detect rotation.
apiVersion: organizations.github.crossplane.io/v1alpha1
kind: OrganizationWebhook
metadata:
  name: sample-organization-webhook
spec:
  forProvider:
    orgRef:
      name: pgh-sample-organization
    url: https://hooks.example.com/github
    contentType: json
    events:
    - push
    - pull_request
    secretKeyRef:
      name: sample-webhook-secret
      namespace: crossplane-system
      key: secret
  writeConnectionSecretToRef:
    name: sample-organization-webhook-conn
    namespace: crossplane-system
