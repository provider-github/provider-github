name: OSV-Scanner

on:
  push:
    branches:
      - main
      - release-*
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Full scan; results land in Security > Code scanning.
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
